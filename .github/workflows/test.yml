name: Build and test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Node 24 only: the `eve` dev dependency declares `engines.node >= 24`,
      # so older versions cannot install the dev toolchain. This constrains
      # development, not consumers — the published package itself has no such
      # requirement unless you use the optional Eve adapter.
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Compiling is itself a check: the package ships generated type
      # declarations, so a type error is a publish-blocking failure.
      - name: Build
        run: yarn build

      - name: Run tests
        run: yarn test
