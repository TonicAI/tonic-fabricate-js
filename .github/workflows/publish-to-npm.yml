name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      # Creating the GitHub Release for the tag.
      contents: write
      # Mints the short-lived OIDC token that npm trusted publishing exchanges
      # for publish rights. No npm token is stored in this repository.
      id-token: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Tags are not restricted to main, so without this a tag on an unmerged
      # branch would publish code that never passed review.
      - name: Verify the tag is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "$GITHUB_REF_NAME is not on main. Refusing to publish."
            exit 1
          fi

      # Deliberately no dependency cache: npm advises against caching in
      # release builds, and this job runs a handful of times a year.
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      # Trusted publishing requires npm 11.5.1 or newer.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Run tests
        run: yarn test

      # The tag is the source of truth for the version; package.json carries a
      # placeholder. This edit lives and dies with the runner.
      - name: Set the version from the tag
        run: npm pkg set version="${GITHUB_REF_NAME#v}"

      - name: Publish
        run: npm publish --access public

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
