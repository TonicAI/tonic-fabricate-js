name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: 'Type "PUBLISH" to confirm publishing to npm'
        required: true
        default: ""

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      # Required to mint the short-lived OIDC token that npm trusted
      # publishing exchanges for publish rights. No long-lived npm token is
      # stored in this repository.
      id-token: write

    steps:
      - name: Verify confirmation (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.confirm_publish }}" != "PUBLISH" ]; then
            echo "Confirmation not received. You must type 'PUBLISH' to confirm."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: yarn

      # Trusted publishing requires npm 11.5.1 or newer.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Run tests
        run: yarn test

      # A release tag that disagrees with package.json silently publishes the
      # wrong version, which cannot be undone once it is on the registry.
      - name: Verify version matches the release tag
        if: github.event_name == 'release'
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          tag="${{ github.event.release.tag_name }}"
          if [ "$pkg" != "$tag" ]; then
            echo "package.json is $pkg but the release tag is $tag"
            exit 1
          fi

      - name: Publish
        run: npm publish --access public
